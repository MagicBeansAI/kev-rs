[package]
name = "kev-core"
version = "0.1.0"
description = "Kev decision-model runtime: exact upstream encoding, MLX (Apple Silicon) and CPU backends, fp32 pointer head and calibration"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.95"

[features]
default = []
# Apple Silicon: the Qwen3.5 hybrid backbone on MLX (mlx-rs, JIT Metal build,
# shared patched mlx-sys). Not available on other targets.
mlx = ["dep:mlx-rs", "dep:mlx-sys", "dep:half"]
# Portable CPU backend (Qwen3 attention-only generation, kev-0.6b) through
# Candle. See docs/K1-RUNTIME.md for the honest CPU scope.
candle = ["dep:candle-core", "dep:candle-nn"]
candle-accelerate = ["candle", "candle-core/accelerate"]

[dependencies]
anyhow = "=1.0.104"
mlx-sys = { version = "=0.6.0", optional = true }
half = { version = "=2.7.1", optional = true }
mlx-rs = { version = "=0.32.0", features = ["safetensors"], optional = true }
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
regex = "=1.13.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["preserve_order", "float_roundtrip"] }
thiserror = "=2.0.21"
tokenizers = { version = "=0.23.2", default-features = false, features = ["fancy-regex"] }

[dev-dependencies]

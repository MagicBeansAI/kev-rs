[workspace]

[package]
name = "mlx-backbone"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
half = "2"
mlx-rs = { version = "=0.32.0", features = ["safetensors"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

# The same pin as the kev-rs root and systemone: laya-rs's patched mlx-sys.
[patch.crates-io]
mlx-sys = { git = "https://github.com/codesoda/laya-rs.git", rev = "23fff422666fd5039998fd8a55ca57f7e40d224b" }
